name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generator
        run: python3 -m compileall -q tools
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate example manifest
        run: python3 -m json.tool .fefo/workspace.example.json >/dev/null
